<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.tailwindcss.com"></script>
        {% load static %}
        <style>
            .messages {
                height: 400px;
                overflow-y: auto;
            }
        </style>
    </head>

    <body class="bg-white-500">
        <nav class="flex items-center justify-between px-4 py-6 bg-red-500">
            <div>
                <img style="float:left;"  src="{% static 'main/img/1.png' %}" height="5%" width="5%"  alt=""><a href="/" class="text-xl  text-white  ">Главная</a>
            </div>

            <div class="flex items-center space-x-4">
                {% if request.user.is_authenticated %}
                    <a href="/rooms/" class="px-5 py-3 rounded-xl text-white bg-red hover:bg-red-400">Чаты</a>
                    <a href="/news/" class="px-5 py-3 rounded-xl text-white bg-red hover:bg-red-400">Новости</a>

                    <form action="/logout/" method="post" class="inline">
    {% csrf_token %}
    <button type="submit" class="px-5 py-3 rounded-xl text-white bg-red hover:bg-red-400">Выйти</button>
</form>
                {% else %}
                    <a href="/login/" class="px-5 py-3 rounded-xl text-white bg-red hover:bg-red-400">Войти</a>
            
                    <a href="/signup/" class="px-5 py-3 rounded-xl text-white bg-red hover:bg-red-400">Регистрация</a>
                {% endif %}
            </div>
        </nav>

        {% block content %}
        {% endblock %}

        {% block scripts %}
        {% endblock %}
    </body>
</html>
